<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkku</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e7c86">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14212b;--mute:#5d6b77;--line:#d5dce2;--acc:#0e7c86;--acc-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#1a242d;--ink:#e8eef2;--mute:#93a3af;--line:#2b3946;--acc:#35b5c0;--acc-ink:#06242a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-weight:800;font-size:2rem;margin:8px 0;letter-spacing:-.02em}
input,button,select,textarea{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:8px}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.link{border:none;background:none;color:var(--acc);padding:4px;text-decoration:underline}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top div{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid}
.st b{font-size:1.6rem;line-height:1.1;font-weight:800}.st span{font-size:.8rem;color:var(--mute)}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{padding:5px 12px;border-radius:99px;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[style]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:hsl(var(--h) 65% 48%)}
.lb{font-weight:600;font-size:.8rem;padding:2px 10px;border-radius:99px;justify-self:start;color:hsl(var(--h) 60% 32%);background:hsl(var(--h) 70% 91%)}
@media (prefers-color-scheme:dark){.lb{color:hsl(var(--h) 70% 78%);background:hsl(var(--h) 35% 24%)}}
.grp{margin:0 0 22px}.grp summary{cursor:pointer;font-weight:800;font-size:1.15rem;padding:6px 0;margin:0 0 12px;border-bottom:2px solid var(--line)}
.grp summary span{font-weight:400;color:var(--mute);font-size:.95rem;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.im{position:relative}.im img,.ph{width:100%;height:160px;object-fit:cover;display:block;background:var(--line)}
.ph{display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:#fff}
.star{position:absolute;right:8px;top:8px;border-radius:99px;padding:1px 9px;font-size:1.15rem;line-height:1.5}.star.on{color:#e0a100}
.nw{position:absolute;left:8px;top:8px;background:var(--acc);color:var(--acc-ink);font-style:normal;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px}
.body{padding:12px 14px;display:grid;gap:6px;flex:1;align-content:start}
.pf{font-size:.85rem;color:var(--mute)}
.card h3{margin:0;font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
.card p{margin:0;font-size:.9rem;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;gap:6px;padding:0 14px 14px;flex-wrap:wrap}
.act a,.act button{font-size:.82rem;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--card)}
.v-list .grid{grid-template-columns:1fr}.v-list .card{display:grid;grid-template-columns:110px 1fr}.v-list .im{grid-row:1/3}.v-list .im img,.v-list .ph{height:100%;min-height:110px}
.v-compact .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.v-compact .im img,.v-compact .ph{height:90px}.v-compact .card p,.v-compact .x{display:none}
.empty{color:var(--mute);padding:34px 10px;text-align:center}
.msg{color:#c0392b;font-size:.9rem;min-height:1.2em}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog form{padding:18px;display:grid;gap:10px}dialog h2{margin:0}
[hidden]{display:none!important}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}}

body{background:radial-gradient(circle at 12% -5%,rgba(14,124,134,.18),transparent 42%),radial-gradient(circle at 95% 8%,rgba(193,53,132,.12),transparent 38%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:22px 22px;opacity:.55}
.st{border-left:4px solid var(--acc)}
.card{cursor:pointer;transition:transform .18s,box-shadow .18s;animation:up .35s both}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.ph{position:relative;isolation:isolate}.ph::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.22) 2px,transparent 2.5px);background-size:16px 16px}
.act{justify-content:flex-end}.ib{font-size:1rem;line-height:1;padding:7px 10px}
.folds{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px 18px;padding-top:12px}
.fold{position:relative;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:6px 16px 16px 16px;padding:64px 16px 16px;display:grid;gap:2px;transition:transform .18s,box-shadow .18s;animation:up .35s both}
.fold::before{content:"";position:absolute;left:-1px;top:-12px;width:48%;height:13px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0}
.fold:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(0,0,0,.15)}
.fold .pk{position:absolute;left:14px;right:14px;top:9px;height:34px;background:var(--line);border-radius:6px;transform:rotate(-2deg)}
.bd{position:absolute;left:16px;top:16px;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.5rem;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.fold b{font-size:1.05rem}.fold span{color:var(--mute);font-size:.88rem}
.ft{margin:6px 0 14px;font-size:1.4rem;font-weight:800}.ft span{font-weight:400;color:var(--mute);font-size:1rem}
#shareBar{margin-top:-6px}#shareBar:empty{display:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;display:flex;gap:12px;align-items:center;z-index:20}
#toast button{background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}
#auth:not([hidden]){position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);overflow:auto}
.art{display:grid;place-items:center;padding:32px;color:#fff;background:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 2px) 0 0/20px 20px,linear-gradient(150deg,#0e7c86,#0b3f66)}
.art h1{font-size:3rem;margin:0}.art p{margin:6px 0 28px;opacity:.9;max-width:320px}
.stack{display:grid;gap:14px;justify-items:start}
.mk{display:flex;align-items:center;gap:12px;width:250px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.28);transform:rotate(var(--r));animation:fl 4s ease-in-out infinite}
.mk:nth-child(2){margin-left:34px;animation-delay:-1.3s}.mk:nth-child(3){animation-delay:-2.6s}
@keyframes fl{50%{transform:rotate(var(--r)) translateY(-8px)}}
.mk b{width:38px;height:38px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center}
.mk span{display:grid;gap:6px;flex:1}.mk i{display:block;height:8px;border-radius:4px;background:#dfe5ea}.mk i+i{width:60%}
.formside{display:grid;place-items:center;padding:24px}.formside .box{width:min(380px,100%)}
#reset:not([hidden]){position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;align-content:center;justify-items:center;gap:6px;padding:20px}
#reset .box{width:min(380px,100%)}
@media(max-width:760px){#auth:not([hidden]){grid-template-columns:1fr;grid-template-rows:auto 1fr}.art{padding:22px 20px;place-items:start}.art h1{font-size:2.2rem}.art p{margin:4px 0 0}.stack{display:none}}
.ck{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;border:2px solid #fff;background:rgba(0,0,0,.35);color:transparent;display:grid;place-items:center;font-weight:800}.ck.on{background:var(--acc);color:var(--acc-ink)}
.card.sel{outline:3px solid var(--acc);outline-offset:-3px}
#selBar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:15;width:min(960px,96vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#selBar input{width:150px;flex:1;min-width:120px}
#toast{bottom:96px}.ib{font-size:.82rem;line-height:1.2;padding:6px 10px}
.shr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
main{padding-bottom:140px}
</style>
</head>
<body>
<main>
<section id="auth" hidden>
  <div class="art"><div><h1>Linkku</h1><p>Semua link media sosial Anda, rapi di satu tempat.</p>
    <div class="stack">
      <div class="mk" style="--c:#c13584;--r:-5deg"><b>I</b><span><i></i><i></i></span></div>
      <div class="mk" style="--c:#101010;--r:4deg"><b>T</b><span><i></i><i></i></span></div>
      <div class="mk" style="--c:#1877f2;--r:-2deg"><b>F</b><span><i></i><i></i></span></div>
    </div></div></div>
  <div class="formside">
  <form class="box" id="authForm">
    <h2 style="margin:0">Masuk ke Linkku</h2>
    <input id="em" type="email" placeholder="Email" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Kata sandi (min. 6 karakter)" autocomplete="current-password" required minlength="6">
    <div class="msg" id="authMsg"></div>
    <button class="p" type="submit">Masuk</button>
    <button type="button" id="signup">Daftar akun baru</button>
    <button type="button" id="forgot" class="link">Lupa kata sandi?</button>
  </form></div>
</section>

<section id="reset" hidden>
  <h1>Linkku</h1>
  <form class="box" id="resetForm" style="max-width:380px">
    <p style="margin:0">Buat kata sandi baru Anda.</p>
    <input id="np" type="password" placeholder="Kata sandi baru (min. 6 karakter)" autocomplete="new-password" required minlength="6">
    <div class="msg" id="resetMsg"></div>
    <button class="p" type="submit">Simpan kata sandi baru</button>
  </form>
</section>

<section id="app" hidden>
  <div class="top"><h1>Linkku</h1>
    <div><button class="p" id="add">+ Tambah link</button><button id="selBtn">Pilih</button><button id="shBtn">Bagikan koleksi</button><button id="csv">Unduh CSV</button><button id="out">Keluar</button></div></div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Cari judul, catatan, atau label">
    <select id="pf" aria-label="Platform"></select>
    <select id="sort" aria-label="Urutan"><option value="new">Terbaru</option><option value="old">Terlama</option></select>
    <select id="view" aria-label="Tampilan"><option value="card">Kartu</option><option value="list">Daftar</option><option value="compact">Ringkas</option></select>
  </div>
  <div class="bar" id="chips"></div>
  <div id="list"></div>
</section>
</main>

<div id="selBar" hidden>
  <b id="cnt">0 dipilih</b>
  <button data-b="all">Pilih semua</button><button data-b="none">Kosongkan</button>
  <input id="bl" list="labels" placeholder="Label tujuan"><button data-b="move">Pindah</button>
  <button data-b="fav">★ Favorit</button><button data-b="share">Bagikan</button><button data-b="del">Hapus</button>
</div>
<div id="toast" hidden></div>
<dialog id="shDlg"><form method="dialog">
  <h2>Bagikan koleksi</h2>
  <p class="pf" style="margin:0">Penerima link hanya bisa melihat isi label, tidak bisa mengubah apa pun.</p>
  <div id="shList"></div>
  <button>Tutup</button>
</form></dialog>
<dialog id="dlg">
  <form id="addForm">
    <h2 id="dT">Tambah link</h2>
    <input id="url" type="url" placeholder="Tempel link Instagram, Facebook, Threads, X, dll" required>
    <input id="label" list="labels" placeholder="Label, mis. Resep, Inspirasi, Kerja">
    <datalist id="labels"></datalist>
    <input id="note" placeholder="Catatan (opsional)">
    <input id="title" placeholder="Judul (opsional, diisi otomatis jika kosong)">
    <input id="cap" placeholder="Teks postingan (opsional, supaya mudah dicari)">
    <label style="font-size:.9rem;color:var(--mute)">Gambar sendiri (opsional, jika preview kosong)
      <input id="img" type="file" accept="image/*" style="margin-top:4px"></label>
    <div class="msg" id="addMsg"></div>
    <div style="display:flex;gap:8px"><button class="p" type="submit" id="saveBtn" style="flex:1">Simpan</button>
    <button type="button" id="cancel">Batal</button></div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PF = [['instagram','Instagram','#c13584'],['facebook','Facebook','#1877f2'],['fb.','Facebook','#1877f2'],['threads','Threads','#101010'],['twitter','X','#14171a'],['x.com','X','#14171a'],['tiktok','TikTok','#010101'],['youtube','YouTube','#e62117'],['youtu.be','YouTube','#e62117'],['linkedin','LinkedIn','#0a66c2']];
const platform = (u) => { const h = new URL(u).hostname; const m = PF.find((p) => h.includes(p[0])); return m ? [m[1], m[2]] : [h.replace('www.', ''), '#5d6b77']; };
const col = (n) => n[0] === '★' ? '#e0a100' : (PF.find((p) => p[1] === n) || [0, 0, '#5d6b77'])[2];
const badge = (n) => `<div class="bd" style="background:${col(n)}">${esc(n[0])}</div>`;
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

let links = [], flt = '', editId = null, newImg = null, pending = null, recovering = location.hash.includes('type=recovery');
let shares = [], openF = null, selMode = false, visRows = []; const busy = new Set(), sel = new Set();

// Link yang dibagikan dari HP (Bagikan > Linkku)
(() => {
  const p = new URLSearchParams(location.search);
  const m = [p.get('url'), p.get('text'), p.get('title')].join(' ').match(/https?:\/\/[^\s]+/);
  if (m) { pending = m[0]; history.replaceState(null, '', location.pathname); }
})();

async function boot() {
  try { $('view').value = localStorage.getItem('view') || 'card'; } catch (_) {}
  sb.auth.onAuthStateChange((e, sess) => { if (e === 'PASSWORD_RECOVERY') recovering = true; show(!!sess); });
  const { data } = await sb.auth.getSession();
  show(!!data.session);
}
async function show(loggedIn) {
  $('reset').hidden = !recovering;
  $('auth').hidden = loggedIn || recovering;
  $('app').hidden = !loggedIn || recovering;
  if (loggedIn && !recovering) { await load(); if (pending) { const u = pending; pending = null; openDlg(null, u); } }
}
$('authForm').onsubmit = async (e) => {
  e.preventDefault(); $('authMsg').textContent = ''; $('authMsg').style.color = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value, password: $('pw').value });
  if (error) $('authMsg').textContent = 'Gagal masuk: email atau kata sandi salah.';
};
$('signup').onclick = async () => {
  $('authMsg').textContent = ''; $('authMsg').style.color = '';
  if (!$('em').value || $('pw').value.length < 6) { $('authMsg').textContent = 'Isi email dan kata sandi (min. 6 karakter) dulu.'; return; }
  const { data, error } = await sb.auth.signUp({ email: $('em').value, password: $('pw').value });
  if (error) $('authMsg').textContent = 'Gagal daftar: ' + error.message;
  else if (!data.session) $('authMsg').textContent = 'Cek email Anda untuk konfirmasi, lalu masuk.';
};
$('forgot').onclick = async () => {
  $('authMsg').style.color = '';
  if (!$('em').value) { $('authMsg').textContent = 'Isi email Anda dulu, lalu tekan Lupa kata sandi.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail($('em').value, { redirectTo: location.origin });
  if (error) { $('authMsg').textContent = 'Gagal mengirim: ' + error.message; return; }
  $('authMsg').style.color = 'var(--acc)';
  $('authMsg').textContent = 'Tautan reset sudah dikirim. Cek email Anda, termasuk folder spam.';
};
$('resetForm').onsubmit = async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.updateUser({ password: $('np').value });
  if (error) { $('resetMsg').textContent = 'Gagal: ' + error.message; return; }
  recovering = false; history.replaceState(null, '', location.pathname); show(true);
};
$('out').onclick = () => sb.auth.signOut();

async function load() {
  const { data, error } = await sb.from('links').select('*').order('created_at', { ascending: false });
  if (error) { alert('Gagal memuat data: ' + error.message); return; }
  const r = await sb.from('shares').select('*'); shares = r.data || [];
  links = data; render();
}
const upd = async (id, f) => { await sb.from('links').update(f).eq('id', id); load(); };

// Jendela tambah / ubah
function openDlg(l, url) {
  editId = l ? l.id : null; newImg = null;
  $('dT').textContent = l ? 'Ubah link' : 'Tambah link';
  $('url').value = l ? l.url : (url || ''); $('url').readOnly = !!l;
  $('label').value = l ? l.label || '' : ''; $('note').value = l ? l.note || '' : '';
  $('title').value = l ? l.title || '' : ''; $('cap').value = l ? l.description || '' : ''; $('img').value = ''; $('addMsg').textContent = '';
  $('dlg').showModal();
}
$('add').onclick = () => openDlg();
$('cancel').onclick = () => $('dlg').close();
const shrink = (file) => new Promise((ok) => {
  const i = new Image();
  i.onload = () => { const k = Math.min(1, 640 / i.width), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .7)); };
  i.src = URL.createObjectURL(file);
});
$('img').onchange = async (e) => { if (e.target.files[0]) newImg = await shrink(e.target.files[0]); };
$('addForm').onsubmit = async (e) => {
  e.preventDefault(); const b = $('saveBtn'); b.disabled = true; b.textContent = 'Menyimpan…';
  const f = { label: $('label').value.trim(), note: $('note').value.trim(), description: $('cap').value.trim() }; let err, id, url;
  if (newImg) f.image = newImg;
  if (editId) { f.title = $('title').value.trim(); ({ error: err } = await sb.from('links').update(f).eq('id', editId)); }
  else {
    url = $('url').value.trim();
    const norm = (u) => u.replace(/\/+$/, '');
    if (links.some((l) => norm(l.url) === norm(url)) && !confirm('Link ini sudah pernah disimpan. Simpan lagi?')) { b.disabled = false; b.textContent = 'Simpan'; return; }
    Object.assign(f, { url, platform: platform(url)[0], title: $('title').value.trim(), image: newImg || '' });
    const r = await sb.from('links').insert(f).select().single(); err = r.error; id = r.data && r.data.id;
  }
  b.disabled = false; b.textContent = 'Simpan';
  if (err) { $('addMsg').textContent = 'Gagal menyimpan: ' + err.message; return; }
  $('dlg').close(); if (id) enrich(id, url, f); load();
};
async function enrich(id, url, f) {
  if (f.title && f.description && f.image) return;
  busy.add(id); render();
  try {
    const pv = await (await fetch('/api/preview?url=' + encodeURIComponent(url), { signal: AbortSignal.timeout(6000) })).json();
    const up = {}; ['title', 'description', 'image'].forEach((k) => { if (!f[k] && pv[k]) up[k] = pv[k]; });
    if (Object.keys(up).length) await sb.from('links').update(up).eq('id', id);
  } catch (_) {}
  busy.delete(id); load();
}
let tt;
function toast(msg, undo) {
  const t = $('toast'); t.innerHTML = esc(msg) + (undo ? ' <button id="tu">Urungkan</button>' : ''); t.hidden = false;
  if (undo) $('tu').onclick = async () => { await undo(); t.hidden = true; load(); };
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 7000);
}
async function shr(o) {
  try { if (navigator.share) await navigator.share(o); else { await navigator.clipboard.writeText(o.url || o.text); toast('Link disalin'); } } catch (_) {}
}
function renderSh() {
  const labels = [...new Set(links.map((l) => l.label).filter(Boolean))].sort();
  $('shList').innerHTML = labels.length ? labels.map((n) => {
    const on = shares.some((x) => x.label === n), c = links.filter((l) => l.label === n).length;
    return `<div class="shr"><span class="lb" style="--h:${hue(n)}">${esc(n)}</span><span class="pf" style="flex:1">${c} link${on ? ' · sedang dibagikan' : ''}</span>
      <button type="button" class="p" data-sh="${esc(n)}">Bagikan</button>${on ? `<button type="button" data-un="${esc(n)}">Hentikan</button>` : ''}</div>`;
  }).join('') : '<p class="pf">Belum ada label. Beri label pada link Anda dulu.</p>';
}
$('shBtn').onclick = () => { renderSh(); $('shDlg').showModal(); };
$('shList').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const n = b.dataset.sh || b.dataset.un; let s = shares.find((x) => x.label === n);
  if (b.dataset.un) { if (s) { await sb.from('shares').delete().eq('token', s.token); await load(); renderSh(); toast('Berbagi dihentikan'); } return; }
  if (!s) { const r = await sb.from('shares').insert({ label: n }).select().single(); if (r.error) { alert('Gagal: ' + r.error.message); return; } s = r.data; await load(); renderSh(); }
  shr({ title: 'Linkku: ' + n, url: location.origin + '/share.html?t=' + s.token });
};
$('selBtn').onclick = () => { selMode = !selMode; sel.clear(); $('selBtn').textContent = selMode ? 'Selesai' : 'Pilih'; render(); };
$('selBar').onclick = async (e) => {
  const k = e.target.closest('[data-b]'); if (!k) return;
  const b = k.dataset.b, ids = [...sel];
  if (b === 'all') { visRows.forEach((l) => sel.add(l.id)); render(); return; }
  if (b === 'none') { sel.clear(); render(); return; }
  if (!ids.length) { toast('Pilih link dulu'); return; }
  const set = links.filter((l) => sel.has(l.id));
  if (b === 'move') {
    const v = $('bl').value.trim(); if (!v) { toast('Isi label tujuan dulu'); return; }
    await sb.from('links').update({ label: v }).in('id', ids); $('bl').value = ''; toast('Dipindah ke “' + v + '”');
  } else if (b === 'fav') await sb.from('links').update({ favorite: true }).in('id', ids);
  else if (b === 'share') { shr({ title: 'Link dari Linkku', text: set.map((l) => l.url).join('\n') }); return; }
  else if (b === 'del') {
    if (!confirm('Hapus ' + ids.length + ' link?')) return;
    const cps = set.map(({ user_id, ...c }) => c);
    await sb.from('links').delete().in('id', ids); toast(ids.length + ' link dihapus', () => sb.from('links').insert(cps));
  }
  sel.clear(); load();
};

// Tampilan
['q', 'sort', 'pf'].forEach((id) => $(id).oninput = render);
$('view').onchange = () => { try { localStorage.setItem('view', $('view').value); } catch (_) {} render(); };
$('csv').onclick = () => {
  const q = (v) => '"' + String(v || '').replace(/"/g, '""') + '"';
  const rows = [['Platform','Link','Label','Judul','Catatan','Tanggal'], ...links.map((l) => [platform(l.url)[0], l.url, l.label, l.title, l.note, (l.created_at || '').slice(0, 10)])];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map((r) => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
  a.download = 'linkku-cadangan.csv'; a.click();
};

function render() {
  const wk = Date.now() - 7 * 864e5;
  $('stats').innerHTML = [['Total', links.length], ['Minggu ini', links.filter((l) => new Date(l.created_at) > wk).length], ['Favorit', links.filter((l) => l.favorite).length], ['Belum dilihat', links.filter((l) => !l.seen).length]]
    .map(([k, v]) => `<div class="st"><b>${v}</b><span>${k}</span></div>`).join('');
  const labels = [...new Set(links.map((l) => l.label).filter(Boolean))].sort();
  const pfs = [...new Set(links.map((l) => platform(l.url)[0]))].sort();
  if (flt && !flt.startsWith('*') && !labels.includes(flt)) flt = '';
  const cur = $('pf').value;
  $('pf').innerHTML = '<option value="">Semua platform</option>' + pfs.map((p) => `<option ${p === cur ? 'selected' : ''}>${esc(p)}</option>`).join('');
  $('labels').innerHTML = labels.map((l) => `<option value="${esc(l)}">`).join('');
  $('chips').innerHTML = [['', 'Semua'], ['*fav', '★ Favorit'], ['*new', 'Belum dilihat'], ...labels.map((l) => [l, l])]
    .map(([v, t]) => `<button class="chip ${v === flt ? 'on' : ''}" data-f="${esc(v)}" ${v && v[0] !== '*' ? `data-lb="1" style="--h:${hue(v)}"` : ''}>${esc(t)}</button>`).join('');
  $('chips').querySelectorAll('button').forEach((b) => {
    b.onclick = () => { flt = b.dataset.f; render(); };
    if (b.dataset.lb) { b.ondragover = (e) => e.preventDefault(); b.ondrop = (e) => { e.preventDefault(); upd(e.dataTransfer.getData('text/plain'), { label: b.dataset.f }); }; }
  });
  const q = $('q').value.toLowerCase(), ps = $('pf').value;
  const rows = links.filter((l) => (flt === '' || (flt === '*fav' ? l.favorite : flt === '*new' ? !l.seen : l.label === flt)) &&
    (!ps || platform(l.url)[0] === ps) && [l.title, l.description, l.note, l.label, l.url].join(' ').toLowerCase().includes(q));
  if ($('sort').value === 'old') rows.reverse();
  const active = flt !== '' || q || ps;
  const ft = (n) => n === '★ Favorit' ? (l) => l.favorite : (l) => platform(l.url)[0] === n;
  if (openF && !links.some(ft(openF))) openF = null;
  $('list').className = 'v-' + $('view').value;
  [...sel].forEach((id) => { if (!links.some((l) => l.id === id)) sel.delete(id); });
  $('selBar').hidden = !selMode; $('cnt').textContent = sel.size + ' dipilih';
  visRows = rows;
  let html = '';
  if (active) html = rows.length ? `<div class="grid">${rows.map(card).join('')}</div>` : '';
  else if (openF) { const arr = rows.filter(ft(openF)); visRows = arr; html = `<button class="link" data-back="1">← Semua folder</button><h2 class="ft">${esc(openF)} <span>${arr.length}</span></h2><div class="grid">${arr.map(card).join('')}</div>`; }
  else {
    const groups = {}; rows.forEach((l) => { const n = platform(l.url)[0]; (groups[n] = groups[n] || []).push(l); });
    const names = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
    const fav = rows.filter((l) => l.favorite).length;
    const fl = (n, c) => `<div class="fold" data-fold="${esc(n)}"><i class="pk"></i><i class="pk" style="top:5px;transform:rotate(2deg)"></i>${badge(n)}<b>${esc(n)}</b><span>${c} link</span></div>`;
    html = names.length ? `<div class="folds">${fav ? fl('★ Favorit', fav) : ''}${names.map((n) => fl(n, groups[n].length)).join('')}</div>` : '';
  }
  $('list').innerHTML = html || `<div class="empty">${links.length ? 'Tidak ada link yang cocok.' : 'Belum ada link.<br>Ketuk “+ Tambah link”, atau di HP pilih Bagikan lalu Linkku dari Instagram, Threads, atau X.'}</div>`;
}
function card(l) {
  const [n, c] = platform(l.url);
  const ph = `<div class="ph" style="background:linear-gradient(135deg,${c},${c}bb)">${esc(n[0])}</div>`;
  const img = l.image ? `<img src="${esc(l.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=ph style=background:${c}>${esc(n[0])}</div>'">` : ph;
  const b = (a, t, tt, cls) => `<button data-a="${a}" data-id="${l.id}" class="ib ${cls || ''}" title="${tt}" aria-label="${tt}">${t}</button>`;
  return `<article class="card ${sel.has(l.id) ? 'sel' : ''}" draggable="true" data-id="${l.id}"><div class="im">${img}
    <button class="star ${l.favorite ? 'on' : ''}" data-a="fav" data-id="${l.id}" title="Favorit" aria-label="Favorit">${l.favorite ? '★' : '☆'}</button>${selMode ? `<span class="ck ${sel.has(l.id) ? 'on' : ''}">✓</span>` : (l.seen ? '' : '<i class="nw">Baru</i>')}</div>
  <div class="body"><div class="pf">${esc(n)}</div>${l.label ? `<span class="lb" style="--h:${hue(l.label)}">${esc(l.label)}</span>` : ''}
    <h3>${esc(l.title || l.url)}</h3>${busy.has(l.id) ? '<p>Memuat preview…</p>' : ''}${l.description ? `<p>${esc(l.description)}</p>` : ''}${l.note ? `<p style="color:var(--ink)">Catatan: ${esc(l.note)}</p>` : ''}</div>
  <div class="act">${b('share', '⤴ Bagikan', 'Bagikan link')}${b('edit', '✎ Ubah', 'Ubah')}${b('del', '🗑 Hapus', 'Hapus')}${b('seen', l.seen ? '○ Belum' : '✓ Dilihat', l.seen ? 'Tandai belum dilihat' : 'Tandai dilihat', 'x')}</div></article>`;
}
$('list').onclick = async (e) => {
  const fo = e.target.closest('[data-fold]'); if (fo) { openF = fo.dataset.fold; render(); return; }
  if (e.target.closest('[data-back]')) { openF = null; render(); return; }
  const t = e.target.closest('[data-a]');
  if (!t) {
    const cd = e.target.closest('.card'); const l = cd && links.find((x) => x.id === cd.dataset.id); if (!l) return;
    if (selMode) { sel.has(l.id) ? sel.delete(l.id) : sel.add(l.id); render(); return; }
    window.open(l.url, '_blank', 'noopener'); if (!l.seen) upd(l.id, { seen: true }); return;
  }
  const id = t.dataset.id, l = links.find((x) => x.id === id), a = t.dataset.a;
  if (a === 'fav') upd(id, { favorite: !l.favorite });
  else if (a === 'seen') upd(id, { seen: !l.seen });
  else if (a === 'share') shr({ title: l.title || 'Link dari Linkku', url: l.url });
  else if (a === 'edit') openDlg(l);
  else if (a === 'del') { await sb.from('links').delete().eq('id', id); const { user_id, ...copy } = l; toast('Link dihapus', () => sb.from('links').insert(copy)); load(); }
};
$('list').ondragstart = (e) => { const c = e.target.closest('.card'); if (c) e.dataTransfer.setData('text/plain', c.dataset.id); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
boot();
</script>
</body>
</html>
